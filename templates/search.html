{% extends "base.html" %}
{% block title %}Search — Lumina{% endblock %}
{% block content %}
<div class="page-title"><div><p class="eyebrow">Discover</p><h1>Search your library</h1><p class="lede">Find photos by filename, folder, date, camera, or visual meaning.</p></div></div>
<form id="smart-search" class="search-panel">
  <div class="search-primary"><span>⌕</span><input type="search" id="search-input" name="q" value="{{ query }}" placeholder="Try “beach at sunset”"><button class="btn primary" type="submit">Search</button></div>
  <div class="filter-row">
    <label><span>Mode</span><select name="mode" id="mode"><option value="catalog">Filename & metadata</option><option value="semantic">Visual meaning</option></select></label>
    <label><span>Collection</span><select name="collection" id="collection"><option value="">All collections</option></select></label>
    <label><span>Year</span><select name="year" id="year"><option value="">Any year</option></select></label>
    <label><span>Type</span><select name="type" id="type"><option value="">Photos & videos</option><option value="image">Photos</option><option value="video">Videos</option></select></label>
    <label><span>Camera</span><select name="camera" id="camera"><option value="">Any camera</option></select></label>
    <label class="check-chip"><input type="checkbox" name="favorites" value="1"> Favorites only</label>
  </div>
</form>
<div class="results-head"><div id="status" class="status-line">Loading…</div><button class="text-btn" id="clear-filters" type="button">Clear filters</button></div>
<div class="grid image-grid" id="search-grid"></div><div class="load-more-wrap"><button class="btn" id="load-more" hidden>Load more</button></div>
{% endblock %}
{% block scripts %}<script>
const FORCED_COLLECTION={{ collection|tojson }};
const form=document.getElementById('smart-search'),grid=document.getElementById('search-grid'),statusEl=document.getElementById('status'),loadMore=document.getElementById('load-more');let page=1,loading=false;
function applyParams(){const p=new URLSearchParams(location.search);for(const el of form.elements){if(!el.name)continue;if(el.type==='checkbox')el.checked=p.get(el.name)==='1';else if(p.has(el.name))el.value=p.get(el.name);}if(FORCED_COLLECTION)document.getElementById('collection').value=FORCED_COLLECTION;}
async function options(){const r=await apiFetch('/api/search/options'),d=await r.json();const c=document.getElementById('collection'),y=document.getElementById('year'),cam=document.getElementById('camera');d.collections.forEach(x=>c.add(new Option(x.label,x.value)));d.years.forEach(x=>y.add(new Option(x,x)));d.cameras.forEach(x=>cam.add(new Option(x,x)));applyParams();}
function params(){const p=new URLSearchParams(new FormData(form));for(const [k,v] of [...p])if(!v)p.delete(k);if(FORCED_COLLECTION)p.set('collection',FORCED_COLLECTION);return p;}
async function run(append=false){if(loading)return;loading=true;if(!append){page=1;grid.innerHTML='';statusEl.textContent='Searching…';}const p=params();p.set('page',page);const semantic=p.get('mode')==='semantic';p.delete('mode');const endpoint=semantic?'/api/semantic-search':'/api/search';try{const r=await apiFetch(endpoint+'?'+p),d=await r.json();if(!r.ok)throw new Error(d.error||'Search failed');d.results.forEach(item=>grid.appendChild(makeThumbCard(mediaCardOptions(item))));lazyLoadThumbs(grid);statusEl.textContent=d.count.toLocaleString()+' result'+(d.count===1?'':'s')+(semantic?' by visual similarity':'');loadMore.hidden=page>=d.total_pages;}catch(e){statusEl.textContent=e.message;loadMore.hidden=true;}finally{loading=false;}}
form.addEventListener('submit',e=>{e.preventDefault();const p=params();history.replaceState(null,'','?'+p);run();});loadMore.addEventListener('click',()=>{page++;run(true);});document.getElementById('clear-filters').addEventListener('click',()=>{form.reset();if(FORCED_COLLECTION)document.getElementById('collection').value=FORCED_COLLECTION;history.replaceState(null,'',location.pathname);run();});
options().then(()=>run());
</script>{% endblock %}
