{% extends "base.html" %}
{% block title %}My albums — Lumina{% endblock %}
{% block content %}<div class="page-title split"><div><p class="eyebrow">Curate</p><h1>My albums</h1><p class="lede">Build personal collections without moving your files.</p></div><button class="btn primary" id="new-album">＋ New album</button></div><div id="album-status" class="status-line">Loading…</div><div class="album-grid" id="album-grid"></div>
<dialog id="album-dialog"><form method="dialog" class="dialog-card" id="album-form"><div class="dialog-head"><h2>New album</h2><button value="cancel" class="icon-button" aria-label="Close">×</button></div><label>Name<input id="album-name" required maxlength="80" placeholder="Weekend in Kyoto"></label><label>Description<textarea id="album-description" maxlength="500" rows="3" placeholder="Optional"></textarea></label><button class="btn primary wide" value="default">Create album</button></form></dialog>{% endblock %}
{% block scripts %}<script>
const dialog=document.getElementById('album-dialog');async function loadAlbums(){const r=await apiFetch('/api/albums'),d=await r.json(),grid=document.getElementById('album-grid'),s=document.getElementById('album-status');grid.innerHTML='';s.textContent=d.albums.length?d.albums.length+' album'+(d.albums.length===1?'':'s'):'No albums yet.';d.albums.forEach(a=>{const card=document.createElement('a');card.className='album-card';card.href='/albums/'+a.id;const endpoint=a.cover_media_type==='video'?'poster':'thumb';const coverUrl=a.cover_subpath?versionThumbnailUrl('/'+endpoint+'/'+encodeURIComponent(a.cover_collection)+'/'+encodeMediaPath(a.cover_subpath)):'';const cover=a.cover_subpath?`<img class="lazy-thumb" data-src="${coverUrl}" alt="">`:'<div class="album-placeholder">▣</div>';card.innerHTML=`<div class="album-cover">${cover}</div><div><strong></strong><span>${a.count} item${a.count===1?'':'s'}</span></div>`;card.querySelector('strong').textContent=a.name;grid.appendChild(card);});lazyLoadThumbs(grid);}document.getElementById('new-album').onclick=()=>dialog.showModal();document.getElementById('album-form').addEventListener('submit',async e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();const r=await apiFetch('/api/albums',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('album-name').value,description:document.getElementById('album-description').value})}),d=await r.json();if(!r.ok){showToast(d.error,'error');return;}dialog.close();e.target.reset();loadAlbums();});loadAlbums();
</script>{% endblock %}
