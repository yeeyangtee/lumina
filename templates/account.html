{% extends "base.html" %}
{% block title %}Account — Lumina{% endblock %}
{% block content %}
<div class="content-narrow">
  <div class="page-title"><div><p class="eyebrow">Account</p><h1>{{ current_user.display_name }}</h1><p class="lede">@{{ current_user.username }} · {{ current_user.role }}</p></div></div>
  <section class="panel"><h2>Change password</h2><form method="post" class="form-stack">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
    <label>Confirm new password<input type="password" name="new_password_confirm" autocomplete="new-password" minlength="8" required></label>
    <button class="btn primary" type="submit">Update password</button></form></section>
  <form method="post" action="{{ url_for('auth.logout') }}" class="logout-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="btn danger" type="submit">Sign out</button></form>
</div>
{% endblock %}
